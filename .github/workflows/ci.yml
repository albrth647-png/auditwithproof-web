# Web de Audit with Proof — build en la nube
#
# Filosofía (AGENTS.md §2): el móvil no instala ni renderiza. Este workflow es
# el único que ejecuta npm y el build de Astro.
#
#  · push a main  → SOLO build (verificación; sube el dist como artefacto)
#  · dispatch con deploy=true → además publica en GitHub Pages
#    (la publicación es decisión del operador: nada sale sin su OK)

name: web-ci

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publicar en GitHub Pages'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fijado a 22.23.4: Astro 7 exige >=22.23.4 y "node-version: 22" en el
      # runner resolvió a 22.23.3 (un parche por debajo) → build rechazado.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      # Sin package-lock.json todavía (el build nunca corre en el móvil):
      # npm install en vez de npm ci. Deuda anotada en WEB.md §8.
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Build de Astro
        run: npm run build

      # Sin .nojekyll, Jekyll descarta `_astro/` (CSS/JS con hash) y el sitio
      # sale sin estilos. Se crea en los DOS jobs: `upload-artifact@v4` no sube
      # ficheros ocultos por defecto, así que el del build no viaja.
      - name: Marcar dist como estático (Jekyll off)
        run: touch dist/.nojekyll

      - name: Subir dist como artefacto (revisable sin publicar)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    # Sin `environment`: Pages está en modo `legacy` (sirve la rama gh-pages),
    # y el environment `github-pages` no existe → el job fallaba antes de
    # ejecutar ningún paso (steps: []). Con contents:write basta para el push.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # `dist/` es un directorio suelto: `git init` NO hereda remote ni las
      # credenciales del checkout → el remoto se pone a mano con el token del run.
      - name: Publicar dist en la rama gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          # El artefacto no trae ocultos (upload-artifact@v4): se recrea aquí.
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name 'Audit with Proof'
          git config user.email 'florito64.1@gmail.com'
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
